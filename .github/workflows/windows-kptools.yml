name: Build Windows kptools

on:
  workflow_dispatch:
  push:
    branches:
      - windows-kptools-ucrt64-20261113
    paths:
      - "tools/**"
      - "kernel/**"
      - "version"
      - "kernel/include/preset.h"
      - "README-Windows.md"
      - ".github/workflows/windows-kptools.yml"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MinGW-w64 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-zlib

      - name: Build native Windows executable
        shell: msys2 {0}
        run: |
          cp kernel/include/preset.h tools/preset.h
          cmake -S tools -B tools/build/windows-x64 \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
          cmake --build tools/build/windows-x64 --parallel

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = ".\tools\build\windows-x64\kptools.exe"
          if (!(Test-Path $exe)) { throw "kptools.exe was not produced" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "kptools --help failed: $LASTEXITCODE" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "kptools --version failed: $LASTEXITCODE" }

          $utf8Path = Join-Path $env:RUNNER_TEMP "kptools-中文路径.bin"
          [System.IO.File]::WriteAllBytes($utf8Path, [System.Text.Encoding]::UTF8.GetBytes("kptools-windows-utf8"))
          $expected = (Get-FileHash -Algorithm SHA1 $utf8Path).Hash.ToLowerInvariant()
          $actual = (& $exe sha1 $utf8Path).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
            throw "UTF-8 path test failed. expected=$expected actual=$actual"
          }

      - name: Verify runtime dependencies
        shell: msys2 {0}
        run: |
          deps="$(objdump -p tools/build/windows-x64/kptools.exe | grep 'DLL Name' || true)"
          echo "$deps"
          if echo "$deps" | grep -Eiq 'msys-2\.0|zlib1\.dll|libgcc_s|libstdc\+\+'; then
            echo "Unexpected non-system runtime dependency detected"
            exit 1
          fi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kptools-windows-x64
          path: tools/build/windows-x64/kptools.exe
          if-no-files-found: error

  build-kpimg-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM64 bare-metal toolchain
        run: |
          curl -L --fail -o arm-toolchain.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-toolchain.tar.xz

      - name: Build Android kpimg for ARM64
        run: |
          export TARGET_COMPILE="$GITHUB_WORKSPACE/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-"
          export ANDROID=1
          make -C kernel
          mkdir -p package
          cp kernel/kpimg package/kpimg
          file package/kpimg

      - name: Upload kpimg
        uses: actions/upload-artifact@v4
        with:
          name: kpimg-android
          path: package/kpimg
          if-no-files-found: error

  package-windows-tools:
    runs-on: ubuntu-latest
    needs:
      - build-windows-x64
      - build-kpimg-android
    steps:
      - name: Download Windows kptools
        uses: actions/download-artifact@v4
        with:
          name: kptools-windows-x64
          path: package

      - name: Download Android kpimg
        uses: actions/download-artifact@v4
        with:
          name: kpimg-android
          path: package

      - name: Verify two-file package
        run: |
          test -s package/kptools.exe
          test -s package/kpimg
          test "$(find package -maxdepth 1 -type f | wc -l)" -eq 2
          file package/kptools.exe package/kpimg

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: kptools-windows-y73s
          path: |
            package/kptools.exe
            package/kpimg
          if-no-files-found: error
